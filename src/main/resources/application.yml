server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**, /api/v1/departments/**

        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/api/v1/requests/**, /api/v1/categories/**, /api/v1/sla/**

        - id: request-routing-service
          uri: lb://request-routing-service
          predicates:
            - Path=/api/v1/routing/assign/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**, /api/v1/events/**
